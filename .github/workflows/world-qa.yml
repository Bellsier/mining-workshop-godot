name: World migration QA

on:
  push:
    branches: ['claude/**', 'codex/godot-world-integration']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get Godot 4.4.1
        shell: bash
        run: |
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          archive=Godot_v4.4.1-stable_linux.x86_64.zip
          curl --fail --show-error --silent --location --retry 2 --output "$RUNNER_TEMP/$archive" "$release/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/${archive%.zip}" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import assets and check scripts
        shell: bash
        run: |
          godot --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$RUNNER_TEMP/import.log"
      - name: World logic matches the web original
        shell: bash
        run: |
          godot --headless --path . --script res://tools/world_logic_test.gd 2>&1 | tee "$RUNNER_TEMP/world-logic.log"
          grep -F 'WORLD LOGIC PASS' "$RUNNER_TEMP/world-logic.log"
      - name: Stage 1 workshop-tunnel route still passes
        shell: bash
        run: |
          godot --headless --path . --fixed-fps 60 -- --route-test 2>&1 | tee "$RUNNER_TEMP/route.log"
          grep -F 'ROUTE PASS' "$RUNNER_TEMP/route.log"
      - name: World exploration route
        shell: bash
        run: |
          if [ -f tools/world_route_test.gd ]; then
            godot --headless --path . --fixed-fps 60 --script res://tools/world_route_test.gd 2>&1 | tee "$RUNNER_TEMP/world-route.log"
            grep -F 'WORLD ROUTE PASS' "$RUNNER_TEMP/world-route.log"
          fi
      - name: World persistence, construction, research and unified route
        shell: bash
        run: |
          set -o pipefail
          for test in save_migration_test workshop_migration_test world_integration_test unified_world_route_test world_scene_test; do
            timeout 90 godot --headless --path . --fixed-fps 60 --script "res://tools/$test.gd" 2>&1 | tee "$RUNNER_TEMP/$test.log"
          done
      - name: Parity fixes (tickets, auto-sell, order timer, fractional stock, JS save kept)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/parity-fixes"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/parity-fixes" godot --headless --path . --script res://tools/parity_fixes_test.gd 2>&1 | tee "$RUNNER_TEMP/parity-fixes.log"
          grep -F 'PARITY FIXES PASS' "$RUNNER_TEMP/parity-fixes.log"
      - name: Save integrity (exact numbers, original bytes, damaged originals, abnormal numbers)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/save-integrity"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/save-integrity" godot --headless --path . --script res://tools/save_integrity_test.gd 2>&1 | tee "$RUNNER_TEMP/save-integrity.log"
          grep -F 'SAVE INTEGRITY PASS' "$RUNNER_TEMP/save-integrity.log"
      - name: Craft huts match the web original (build, recipes, crafting, saves, workshop-only recipes)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/craft-huts"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/craft-huts" godot --headless --path . --script res://tools/craft_hut_test.gd 2>&1 | tee "$RUNNER_TEMP/craft-huts.log"
          grep -F 'CRAFT HUT PASS' "$RUNNER_TEMP/craft-huts.log"
      - name: Economy matches the web original (tick income, crafting order, costs, expansion, veins)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/economy_parity_test.gd 2>&1 | tee "$RUNNER_TEMP/economy.log"
          grep -F 'ECONOMY PARITY PASS' "$RUNNER_TEMP/economy.log"
      - name: Village layout matches the web original (sites, plaza, roads, garden, hut spots)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/village_layout_test.gd 2>&1 | tee "$RUNNER_TEMP/village-layout.log"
          grep -F 'VILLAGE LAYOUT PASS' "$RUNNER_TEMP/village-layout.log"
      - name: World objects played through the world map (huts, village, house, garden, torches)
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --fixed-fps 60 --script res://tools/world_objects_test.gd 2>&1 | tee "$RUNNER_TEMP/world-objects.log"
          grep -F 'WORLD OBJECTS PASS' "$RUNNER_TEMP/world-objects.log"
      - name: Large saves with huts (import, autosave, load times and nothing lost)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/save-performance"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/save-performance" godot --headless --path . --script res://tools/save_performance_test.gd 2>&1 | tee "$RUNNER_TEMP/save-performance.log"
          grep -F 'SAVE PERFORMANCE PASS' "$RUNNER_TEMP/save-performance.log"
      - name: Failed import preserves world and protected save
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/world-save-failure"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/world-save-failure" godot --headless --path . --script res://tools/world_save_failure_test.gd 2>&1 | tee "$RUNNER_TEMP/save-failure.log"
      - name: No script errors in the runs
        if: always()
        shell: bash
        run: |
          ! cat "$RUNNER_TEMP"/*.log 2>/dev/null | grep -E 'SCRIPT ERROR:|Parse Error:'
