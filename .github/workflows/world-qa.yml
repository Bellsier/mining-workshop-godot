name: World migration QA

on:
  push:
    branches: [main, 'claude/**', 'codex/godot-world-integration', 'codex/all-region-expeditions']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare headless log directory
        run: |
          mkdir -p "$RUNNER_TEMP/godot-world-logs"
          echo "QA_LOG_DIR=$RUNNER_TEMP/godot-world-logs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Get Godot 4.4.1
        shell: bash
        run: |
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          archive=Godot_v4.4.1-stable_linux.x86_64.zip
          curl --fail --show-error --silent --location --retry 2 --output "$RUNNER_TEMP/$archive" "$release/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/${archive%.zip}" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import assets and check scripts
        shell: bash
        run: |
          godot --headless --path . --editor --import 2>&1 | tee "$QA_LOG_DIR/import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$QA_LOG_DIR/import.log"; then exit 1; fi
      - name: World logic matches the web original
        shell: bash
        run: |
          godot --headless --path . --script res://tools/world_logic_test.gd 2>&1 | tee "$QA_LOG_DIR/world-logic.log"
          grep -F 'WORLD LOGIC PASS' "$QA_LOG_DIR/world-logic.log"
      - name: Stage 1 workshop-tunnel route still passes
        shell: bash
        run: |
          godot --headless --path . --fixed-fps 60 -- --route-test 2>&1 | tee "$QA_LOG_DIR/route.log"
          grep -F 'ROUTE PASS' "$QA_LOG_DIR/route.log"
      - name: World exploration route
        shell: bash
        run: |
          godot --headless --path . --fixed-fps 60 --script res://tools/world_route_test.gd 2>&1 | tee "$QA_LOG_DIR/world-route.log"
          grep -F 'WORLD ROUTE PASS' "$QA_LOG_DIR/world-route.log"
      - name: World persistence, construction, research and unified route
        shell: bash
        run: |
          set -o pipefail
          for test in save_migration_test workshop_migration_test world_integration_test unified_world_route_test world_scene_test; do
            timeout 90 godot --headless --path . --fixed-fps 60 --script "res://tools/$test.gd" 2>&1 | tee "$QA_LOG_DIR/$test.log"
          done
      - name: Parity fixes (tickets, auto-sell, order timer, fractional stock, JS save kept)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/parity-fixes"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/parity-fixes" godot --headless --path . --script res://tools/parity_fixes_test.gd 2>&1 | tee "$QA_LOG_DIR/parity-fixes.log"
          grep -F 'PARITY FIXES PASS' "$QA_LOG_DIR/parity-fixes.log"
      - name: Save integrity (exact numbers, original bytes, damaged originals, abnormal numbers)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/save-integrity"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/save-integrity" godot --headless --path . --script res://tools/save_integrity_test.gd 2>&1 | tee "$QA_LOG_DIR/save-integrity.log"
          grep -F 'SAVE INTEGRITY PASS' "$QA_LOG_DIR/save-integrity.log"
      - name: Verify save parity, recovery and expedition progression
        run: |
          for test in save_parity_regression_test save_recovery_test region_story_test expedition_test expedition_polish_test; do
            MINING_QA_ISOLATED=1 XDG_DATA_HOME="$(mktemp -d)" \
              timeout 120 godot --headless --path . --fixed-fps 60 --script "res://tools/$test.gd" 2>&1 | tee "$QA_LOG_DIR/$test.log"
          done
          grep -Fx 'SAVE PARITY REGRESSION PASS' "$QA_LOG_DIR/save_parity_regression_test.log"
          grep -Fx 'SAVE RECOVERY PASS' "$QA_LOG_DIR/save_recovery_test.log"
          grep -Fx 'REGION STORY PASS' "$QA_LOG_DIR/region_story_test.log"
          grep -Fx 'EXPEDITION PASS' "$QA_LOG_DIR/expedition_test.log"
          grep -Fx 'EXPEDITION POLISH PASS' "$QA_LOG_DIR/expedition_polish_test.log"
      - name: Craft huts match the web original (build, recipes, crafting, saves, workshop-only recipes)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/craft-huts"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/craft-huts" godot --headless --path . --script res://tools/craft_hut_test.gd 2>&1 | tee "$QA_LOG_DIR/craft-huts.log"
          grep -F 'CRAFT HUT PASS' "$QA_LOG_DIR/craft-huts.log"
      - name: Economy matches the web original (tick income, crafting order, costs, expansion, veins)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/economy_parity_test.gd 2>&1 | tee "$QA_LOG_DIR/economy.log"
          grep -F 'ECONOMY PARITY PASS' "$QA_LOG_DIR/economy.log"
      - name: Village layout matches the web original (sites, plaza, roads, garden, hut spots)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/village_layout_test.gd 2>&1 | tee "$QA_LOG_DIR/village-layout.log"
          grep -F 'VILLAGE LAYOUT PASS' "$QA_LOG_DIR/village-layout.log"
      - name: World objects played through the world map (huts, village, house, garden, torches)
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --fixed-fps 60 --script res://tools/world_objects_test.gd 2>&1 | tee "$QA_LOG_DIR/world-objects.log"
          grep -F 'WORLD OBJECTS PASS' "$QA_LOG_DIR/world-objects.log"
      - name: 제작 tab keeps the row under the pointer in place (hut recipe picked, list redrawn)
        shell: bash
        run: |
          set -o pipefail
          timeout 120 godot --headless --path . --fixed-fps 60 --script res://tools/craft_tab_layout_test.gd 2>&1 | tee "$QA_LOG_DIR/craft-tab-layout.log"
          grep -F 'CRAFT TAB LAYOUT PASS' "$QA_LOG_DIR/craft-tab-layout.log"
      - name: Menu input (free delivery, held presses, swipes, kept popups and drafts)
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --path . --fixed-fps 60 --script res://tools/hud_input_test.gd 2>&1 | tee "$QA_LOG_DIR/hud-input.log"
          grep -F 'HUD INPUT PASS' "$QA_LOG_DIR/hud-input.log"
      - name: Menu redraws keep the same list as a full redraw (every tab, random rows)
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --path . --fixed-fps 60 --script res://tools/hud_reconcile_test.gd 2>&1 | tee "$QA_LOG_DIR/hud-reconcile.log"
          grep -F 'HUD RECONCILE PASS' "$QA_LOG_DIR/hud-reconcile.log"
      - name: World look and feedback (web sprites, clouds, fireflies, sway, rising texts, next-step card)
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --path . --fixed-fps 60 --script res://tools/world_effects_test.gd 2>&1 | tee "$QA_LOG_DIR/world-effects.log"
          grep -F 'WORLD EFFECTS PASS' "$QA_LOG_DIR/world-effects.log"
      - name: Long play with every effect on (nodes, objects and memory do not pile up)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . --fixed-fps 60 --script res://tools/world_long_run_bench.gd -- --check 2>&1 | tee "$QA_LOG_DIR/world-long-run.log"
          grep -F 'WORLD LONG RUN DONE' "$QA_LOG_DIR/world-long-run.log"
      - name: World action button with long labels (568x320, 740x360, 960x540)
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --path . --fixed-fps 60 --script res://tools/hud_action_test.gd 2>&1 | tee "$QA_LOG_DIR/hud-action.log"
          grep -F 'HUD ACTION PASS' "$QA_LOG_DIR/hud-action.log"
      - name: Menu redraws while the game runs (rows added per 100 ticks, frame times)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --path . --fixed-fps 60 --script res://tools/hud_redraw_bench.gd -- --check 2>&1 | tee "$QA_LOG_DIR/hud-redraw.log"
          grep -F 'HUD REDRAW BENCH DONE' "$QA_LOG_DIR/hud-redraw.log"
      - name: Large saves with huts (import, autosave, load times and nothing lost)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/save-performance"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/save-performance" godot --headless --path . --script res://tools/save_performance_test.gd 2>&1 | tee "$QA_LOG_DIR/save-performance.log"
          grep -F 'SAVE PERFORMANCE PASS' "$QA_LOG_DIR/save-performance.log"
      - name: Failed import preserves world and protected save
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/world-save-failure"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/world-save-failure" godot --headless --path . --script res://tools/world_save_failure_test.gd 2>&1 | tee "$QA_LOG_DIR/save-failure.log"
      - name: Check for unexpected Godot errors
        if: always()
        run: |
          shopt -s nullglob
          logs=("$QA_LOG_DIR"/*.log)
          if (( ${#logs[@]} == 0 )); then exit 1; fi
          for log in "${logs[@]}"; do
            pattern='SCRIPT ERROR:|Parse Error:|^ERROR:'
            # These tests deliberately exercise failed or refused saves.
            case "${log##*/}" in
              save_recovery_test.log|save-failure.log|save-performance.log) pattern='SCRIPT ERROR:|Parse Error:' ;;
            esac
            if grep -nE "$pattern" "$log"; then exit 1; fi
          done
      - name: Keep headless world and parity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-headless-world-logs
          path: ${{ env.QA_LOG_DIR }}
          retention-days: 30
