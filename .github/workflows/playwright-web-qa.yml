name: Godot Web Playwright QA

on:
  push:
    branches: [qa/playwright-web-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          archive=Godot_v4.4.1-stable_linux.x86_64.zip
          curl --fail --show-error --silent --location --retry 2 --output "$RUNNER_TEMP/$archive" "$release/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/${archive%.zip}" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --editor --import

      - name: Export Web build
        shell: bash
        run: |
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          templates="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$templates" "$RUNNER_TEMP/web"
          curl --fail --show-error --silent --location --retry 2 --output "$RUNNER_TEMP/templates.tpz" "$release/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -j "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_*.zip' -d "$templates"
          godot --headless --path . --export-release Web "$RUNNER_TEMP/web/index.html"
          test -s "$RUNNER_TEMP/web/index.html"
          test -s "$RUNNER_TEMP/web/index.wasm"
          test -s "$RUNNER_TEMP/web/index.pck"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Start local Web server
        shell: bash
        run: |
          cd "$RUNNER_TEMP/web"
          python3 -m http.server 8080 --bind 127.0.0.1 > "$RUNNER_TEMP/web-server.log" 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/web-server.log"
          exit 1

      - name: Run Chromium smoke test
        run: npx playwright test tests/godot-web-smoke.spec.js --browser chromium --workers=1 --reporter=line

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
