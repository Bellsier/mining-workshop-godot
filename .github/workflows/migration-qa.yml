name: Godot migration QA

on:
  push:
    branches: [codex/godot-migration, claude/feature-parity-p0, claude/modest-mendel-yvz6iv]
  pull_request:
    branches: [main, codex/godot-world-integration, codex/moss-marsh-stories]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  web-save:
    name: Web save durability (${{ matrix.browser }})
    needs: godot
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.59.0-noble
      options: --ipc=host
    timeout-minutes: 25
    env:
      # Firefox refuses to start as root when $HOME belongs to another user (Playwright container note).
      HOME: /root
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mining-workshop-godot-web
          path: ${{ runner.temp }}/save-qa-web
      - name: Software OpenGL for Firefox
        # Firefox has no bundled software GL (Chromium uses SwiftShader): without Mesa in the
        # container it reports "Exhausted GL driver options" and the Godot build cannot start.
        if: matrix.browser == 'firefox'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libgl1-mesa-dri libegl1 libegl-mesa0 libglx-mesa0 libgles2 xvfb xauth > /dev/null
      - name: Install save QA dependencies
        working-directory: tests/web-save
        run: npm ci
      - name: IndexedDB save module in ${{ matrix.browser }}
        working-directory: tests/web-save
        env:
          SAVE_QA_BROWSERS: ${{ matrix.browser }}
          SAVE_QA_OUTPUT: ${{ runner.temp }}/save-qa-results/${{ matrix.browser }}
        run: node store-unit.cjs
      - name: Game saves in ${{ matrix.browser }} (delayed, rejected, interrupted, migrated, protected)
        if: ${{ !cancelled() }}
        working-directory: tests/web-save
        env:
          SAVE_QA_BROWSER: ${{ matrix.browser }}
          SAVE_QA_WEB: ${{ runner.temp }}/save-qa-web
          SAVE_QA_OUTPUT: ${{ runner.temp }}/save-qa-results
        # Headless Firefox finds no GL driver even with Mesa installed; a headed Firefox on a virtual X
        # display uses Mesa's software GL (llvmpipe). Chromium and WebKit run headless as before.
        run: |
          if [ "$SAVE_QA_BROWSER" = firefox ]; then
            SAVE_QA_HEADED=1 xvfb-run -a -s "-screen 0 1280x800x24" node run.cjs
          else
            node run.cjs
          fi
      - name: Repeat WebKit start and reload
        if: ${{ !cancelled() && matrix.browser == 'webkit' }}
        working-directory: tests/web-save
        env:
          SAVE_QA_BROWSER: webkit
          SAVE_QA_WEB: ${{ runner.temp }}/save-qa-web
          SAVE_QA_OUTPUT: ${{ runner.temp }}/save-qa-results/webkit-startup
          SAVE_QA_REPEAT: '12'
        run: node run.cjs
      - name: Workshop menu in Chromium (desktop 960x540 and phone 568x320, mouse, keyboard and touch)
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        working-directory: tests/web-save
        env:
          SAVE_QA_WEB: ${{ runner.temp }}/save-qa-web
          SAVE_QA_OUTPUT: ${{ runner.temp }}/save-qa-results
        run: node hud-browser.cjs
      - name: Regional story actions survive a browser reload
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        working-directory: tests/web-save
        env:
          SAVE_QA_WEB: ${{ runner.temp }}/save-qa-web
          SAVE_QA_OUTPUT: ${{ runner.temp }}/save-qa-results
        run: |
          node region-story.cjs
          node expedition.cjs
      - name: Keep browser save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-save-qa-${{ matrix.browser }}
          path: ${{ runner.temp }}/save-qa-results
          retention-days: 30

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare headless log directory
        run: |
          mkdir -p "$RUNNER_TEMP/godot-migration-logs"
          echo "QA_LOG_DIR=$RUNNER_TEMP/godot-migration-logs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Get Godot 4.4.1
        shell: bash
        run: |
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          archive=Godot_v4.4.1-stable_linux.x86_64.zip
          curl --fail --show-error --silent --location --retry 2 --output "$RUNNER_TEMP/$archive" "$release/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/${archive%.zip}" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import assets and check scripts
        shell: bash
        run: |
          godot --headless --path . --editor --import 2>&1 | tee "$QA_LOG_DIR/import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$QA_LOG_DIR/import.log"; then exit 1; fi
      - name: Verify gameplay, save conversion and walking route
        shell: bash
        run: |
          godot --headless --path . --script res://tools/workshop_migration_test.gd 2>&1 | tee "$QA_LOG_DIR/gameplay.log"
          grep -F 'WORKSHOP MIGRATION PASS' "$QA_LOG_DIR/gameplay.log"
          godot --headless --path . --script res://tools/save_migration_test.gd 2>&1 | tee "$QA_LOG_DIR/save.log"
          grep -F 'Save migration tests passed' "$QA_LOG_DIR/save.log"
          mkdir -p "$RUNNER_TEMP/save-recovery"
          MINING_QA_ISOLATED=1 XDG_DATA_HOME="$RUNNER_TEMP/save-recovery" godot --headless --path . --script res://tools/save_recovery_test.gd 2>&1 | tee "$QA_LOG_DIR/recovery.log"
          grep -F 'SAVE RECOVERY PASS' "$QA_LOG_DIR/recovery.log"
          godot --headless --path . --fixed-fps 60 -- --route-test 2>&1 | tee "$QA_LOG_DIR/route.log"
          grep -F 'ROUTE PASS' "$QA_LOG_DIR/route.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$QA_LOG_DIR/"{gameplay,save,route}.log; then exit 1; fi
          # The recovery test provokes failed writes on purpose; only script errors fail it here.
          if grep -E 'SCRIPT ERROR:|Parse Error:' "$QA_LOG_DIR/recovery.log"; then exit 1; fi
      - name: Verify regional investigations, puzzle order and save compatibility
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/region-story" godot --headless --fixed-fps 60 --script res://tools/region_story_test.gd 2>&1 | tee "$QA_LOG_DIR/region-story.log"
          grep -Fx 'REGION STORY PASS' "$QA_LOG_DIR/region-story.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$QA_LOG_DIR/region-story.log"; then exit 1; fi
      - name: Verify expedition gates, temple checkpoint and surface return
        run: |
          set -o pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/expedition" godot --headless --fixed-fps 60 --script res://tools/expedition_test.gd 2>&1 | tee "$QA_LOG_DIR/expedition.log"
          grep -Fx 'EXPEDITION PASS' "$QA_LOG_DIR/expedition.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$QA_LOG_DIR/expedition.log"; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/expedition-polish" godot --headless --script res://tools/expedition_polish_test.gd 2>&1 | tee "$QA_LOG_DIR/expedition-polish.log"
          grep -Fx 'EXPEDITION POLISH PASS' "$QA_LOG_DIR/expedition-polish.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$QA_LOG_DIR/expedition-polish.log"; then exit 1; fi
      - name: Verify tunnel construction conditions for visual QA
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/world_integration_test.gd 2>&1 | tee "$QA_LOG_DIR/construction.log"
          grep -F 'WORLD INTEGRATION PASS' "$QA_LOG_DIR/construction.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$QA_LOG_DIR/construction.log"; then exit 1; fi
      - name: Verify imported save parity and exact original bytes
        run: |
          for test in save_parity_regression_test save_integrity_test; do
            MINING_QA_ISOLATED=1 XDG_DATA_HOME="$(mktemp -d)" \
              godot --headless --path . --script "res://tools/$test.gd" 2>&1 | tee "$QA_LOG_DIR/$test.log"
            if grep -E 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$QA_LOG_DIR/$test.log"; then exit 1; fi
          done
          grep -Fx 'SAVE PARITY REGRESSION PASS' "$QA_LOG_DIR/save_parity_regression_test.log"
          grep -Fx 'SAVE INTEGRITY PASS' "$QA_LOG_DIR/save_integrity_test.log"
      - name: Keep headless migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-headless-migration-logs
          path: ${{ env.QA_LOG_DIR }}
          retention-days: 30
      - name: Build private Web preview
        shell: bash
        run: |
          release=https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable
          templates="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$templates" "$RUNNER_TEMP/web"
          curl --fail --show-error --silent --location --retry 2 --output "$RUNNER_TEMP/templates.tpz" "$release/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -j "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_*.zip' -d "$templates"
          godot --headless --path . --export-release Web "$RUNNER_TEMP/web/index.html"
          test -s "$RUNNER_TEMP/web/index.wasm"
          test -s "$RUNNER_TEMP/web/index.pck"
      - name: Keep Web preview with this run
        uses: actions/upload-artifact@v4
        with:
          name: mining-workshop-godot-web
          path: ${{ runner.temp }}/web
          retention-days: 7

  visual:
    name: Visual QA (Chromium)
    needs: godot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 12
    env:
      VISUAL_QA_SHA: ${{ github.sha }}
      VISUAL_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VISUAL_QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/visual-results"
          printf 'VISUAL_QA_OUTPUT=%s\nVISUAL_QA_WEB=%s\n' \
            "$RUNNER_TEMP/visual-results" "$RUNNER_TEMP/visual-web" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: needs.godot.result == 'success'
      - uses: actions/setup-node@v4
        if: needs.godot.result == 'success'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/visual/package-lock.json
      - uses: actions/download-artifact@v4
        if: needs.godot.result == 'success'
        with:
          name: mining-workshop-godot-web
          path: ${{ env.VISUAL_QA_WEB }}
      - name: Install visual QA Node.js dependencies
        if: needs.godot.result == 'success'
        working-directory: tests/visual
        run: npm ci
      - name: Capture visual QA scenarios
        id: capture
        if: needs.godot.result == 'success'
        working-directory: tests/visual
        env:
          VISUAL_QA_CONSTRUCTION: PASS
        shell: bash
        run: npm test 2>&1 | tee "$VISUAL_QA_OUTPUT/runner.log"
      - name: Preserve setup failure report
        if: always()
        env:
          BUILD_RESULT: ${{ needs.godot.result }}
          CAPTURE_RESULT: ${{ steps.capture.outcome }}
        run: |
          if [ ! -s "$VISUAL_QA_OUTPUT/result.json" ]; then
            mkdir -p "$VISUAL_QA_OUTPUT"
            printf '{"status":"NOT RUN","commit":"%s","build":"%s","captureStep":"%s","cases":[]}\n' \
              "$VISUAL_QA_SHA" "$BUILD_RESULT" "$CAPTURE_RESULT" > "$VISUAL_QA_OUTPUT/result.json"
            printf '# 시각 QA 미실행\n\n- 커밋 %s\n- Godot 작업 %s\n- 브라우저 작업 %s\n- [GitHub Actions 설정·빌드 로그](%s)\n' \
              "$VISUAL_QA_SHA" "$BUILD_RESULT" "$CAPTURE_RESULT" "$VISUAL_QA_RUN_URL" > "$VISUAL_QA_OUTPUT/report.md"
            printf 'Browser did not start. See workflow job logs.\n' > "$VISUAL_QA_OUTPUT/browser.log"
          fi
      - name: Upload screenshots, results and logs
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-visual-qa
          path: ${{ env.VISUAL_QA_OUTPUT }}
          if-no-files-found: error
          retention-days: 30
      - name: Add QA report to run summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          {
            printf '## 시각 QA 산출물\n\n'
            if [ -n "$ARTIFACT_URL" ]; then
              printf '[godot-visual-qa ZIP](%s)\n\n' "$ARTIFACT_URL"
            fi
            sed '/^### /,$d' "$VISUAL_QA_OUTPUT/report.md"
          } >> "$GITHUB_STEP_SUMMARY"
